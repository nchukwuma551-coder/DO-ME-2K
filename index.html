<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Question ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- BACKGROUND AUDIO -->
    <audio id="backgroundMusic" loop>
        <source src="Snapchat-1309400361.mp3" type="audio/mpeg">
    </audio>


    <!-- =========================
         MAIN QUESTION
    ========================== -->

    <main id="questionScreen" class="screen">

        <div class="card">

            <div class="heart">
              🥹  
            </div>

            <h1>
                abeg do me 2K
            </h1>

            <p class="subtitle">
                abeggggg
            </p>

            <div class="buttons">

                <button id="yesBtn">
                    YES my Nelson my lord
                </button>

                <button id="noBtn">
                    NO i am gay
                </button>

            </div>

        </div>

    </main>


    <!-- =========================
         YES SCREEN
    ========================== -->

    <main id="yesScreen" class="screen hidden">

        <!-- Background video -->

        <video
            id="backgroundVideo"
            class="background-video"
            autoplay
            muted
            loop
            playsinline>

            <source src="Snapchat-1771275341.mp4" type="video/mp4">

        </video>


        <!-- Background fallback image -->

        <div class="background-image"></div>


        <!-- Dark overlay -->

        <div class="overlay"></div>


        <!-- Account information -->

        <div class="account-content">

            <div class="success-icon">
                
            </div>

            <h1>
                Thank You 
            </h1>

            <p>
                You can send it here:
            </p>

            <div class="account-number">

                <span id="accountNumber">
                    9049984330
                    OPAY
                </span>

                <button id="copyBtn">
                    Copy
                </button>

            </div>

            <p id="copyMessage">
            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
